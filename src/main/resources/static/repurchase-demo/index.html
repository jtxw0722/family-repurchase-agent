<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家庭复购品价格分析</title>
    <link rel="icon" type="image/png" href="/repurchase-demo/favicon.png?v=1">
    <link rel="shortcut icon" type="image/png" href="/repurchase-demo/favicon.png?v=1">
    <link rel="apple-touch-icon" href="/repurchase-demo/favicon.png?v=1">
    <link rel="stylesheet" href="css/styles.css?v=20261119-assistant-home">
</head>
<body>
<div class="app">
    <header class="product-header glass">
        <div class="brand-row">
            <button id="home-button" class="brand brand-home" type="button" aria-label="返回复购助手首页" aria-controls="assistant" disabled>
                <span class="brand-mark"><img src="/repurchase-demo/favicon.png?v=1" alt=""></span>
                <span>
                    <span class="brand-name">家庭复购品价格分析</span>
                    <span class="brand-description">适合记录与对比纸巾、洗衣液、沐浴露等经常复购的家庭用品。</span>
                </span>
            </button>
            <nav class="tabs" aria-label="功能切换">
                <button class="tab" data-target="compare" type="button" disabled>💰 价格比价</button>
                <button class="tab" data-target="search" type="button" disabled>🔎 购买记录</button>
                <button class="tab" data-target="record" type="button" disabled>📝 记录样本</button>
                <button class="tab" data-target="normalization" type="button" disabled>🧩 规则管理</button>
                <button class="tab" data-target="import" type="button" disabled>📦 订单导入</button>
                <button class="tab" data-target="inventory" type="button" disabled>🏠 库存复购</button>
            </nav>
        </div>

    </header>

    <main id="modules-root" aria-busy="true">
        <p role="status">正在加载页面…</p>
    </main>
</div>

<script type="module" src="js/app.js?v=20261119-assistant-home"></script>
