<section id="assistant" class="module" aria-labelledby="assistant-title">
    <div class="assistant-home-layout">
        <div class="panel panel-inner assistant-panel">
            <div class="panel-title">
                <div>
                    <h2 id="assistant-title">复购助手</h2>
                    <p id="assistant-description">可以咨询复购和商品规格。家庭库存与历史订单请在对应页面查询。</p>
                </div>
                <button id="assistant-minimize" class="btn btn-secondary assistant-minimize" type="button"
                        aria-controls="assistant" aria-label="收起复购助手" hidden>收起</button>
            </div>
            <ol id="assistant-messages" class="assistant-messages" role="log" aria-label="聊天记录"></ol>
            <form id="assistant-form" class="assistant-form">
                <label for="assistant-message">消息</label>
                <textarea id="assistant-message" maxlength="2000" rows="2" required
                          aria-describedby="assistant-privacy" placeholder="例如：买纸巾时怎么比较不同规格的价格？"></textarea>
                <div class="assistant-controls">
                    <p id="assistant-privacy">消息及近期对话会发送到服务端配置的模型。</p>
                    <button id="assistant-send" class="btn btn-primary" type="submit">发送</button>
                </div>
                <p id="assistant-status" class="assistant-status" role="status"></p>
            </form>
        </div>
        <aside class="assistant-dashboards" aria-label="复购看板">
            <section class="panel panel-inner dashboard-card" aria-labelledby="price-overview-title">
                <div class="dashboard-heading">
                    <h2 id="price-overview-title">历史价格</h2>
                    <button id="dashboard-refresh" class="btn btn-secondary btn-small" type="button">刷新看板</button>
                </div>
                <div class="dashboard-price-controls">
                    <p>按标准单位显示单价</p>
                    <select id="dashboard-price-category" aria-label="筛选价格品类">
                        <option value="">全部品类</option>
                    </select>
                </div>
                <div id="dashboard-prices" class="dashboard-table-wrap" aria-busy="true">
                    <p class="dashboard-feedback" role="status">正在读取历史价格…</p>
                </div>
            </section>
            <section class="panel panel-inner dashboard-card" aria-labelledby="replenishment-overview-title">
                <div class="dashboard-heading">
                    <h2 id="replenishment-overview-title">补货提醒</h2>
                </div>
                <div id="dashboard-replenishment" aria-busy="true">
                    <p class="dashboard-feedback" role="status">正在读取补货提醒…</p>
                </div>
            </section>
        </aside>
    </div>
</section>
<button id="assistant-launcher" class="assistant-launcher" type="button"
        aria-controls="assistant" aria-expanded="false" aria-label="展开复购助手"
        title="展开复购助手" hidden><span aria-hidden="true">💬</span></button>
