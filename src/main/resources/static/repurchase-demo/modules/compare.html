<section id="compare" class="module">
    <div class="workspace">
        <div class="panel">
            <div class="panel-inner">
                <div class="panel-title">
                    <div><h2>价格比价</h2><p>输入当前商品价格和规格数量，查看历史基准线。</p></div>
                    <span class="tag">买前参考</span>
                </div>
                <form id="compare-form" class="form-grid">
                    <label class="field-full">品类
                        <select id="compare-category-select">
                            <option value="">全部品类</option>
                        </select>
                        <span class="field-hint">先选品类可筛选下方规则；选择规则后会自动带出所属品类。</span>
                    </label>
                    <label class="field-full">选择商品
                        <select id="compare-rule-select">
                            <option value="">加载规则库后可选择</option>
                        </select>
                        <span class="field-hint">选择后会自动填入商品名称和标准单位；不选择也可以手动输入。</span>
                    </label>
                    <details id="compare-name-editor" class="field-full" open><summary>商品名称：<span id="compare-name-summary">猫粮</span><span class="compare-name-edit">修改</span></summary><label>商品名称 *
                        <input name="productName" id="compare-product-name" required value="猫粮" placeholder="例如：猫砂 / 纸巾 / 沐浴露" autocomplete="off">
                        <span class="field-hint">可以输入订单里的商品名，也可以使用上方规则库选项带入。</span>
                    </label></details>
                    <label>购买价格<input name="price" type="number" min="0" step="0.01" placeholder="例如：19.99"></label>
                    <label>购买数量<input name="quantity" id="compare-purchase-quantity" type="number" min="0" step="any" value="1"></label>
                    <label>单件规格<input name="skuQuantity" id="compare-sku-quantity" type="number" min="0" step="any" placeholder="例如：550"></label>
                    <label>单位
                        <input name="unit" id="compare-unit" list="compare-unit-options" value="kg" placeholder="kg / g / ml / 片 / 条" autocomplete="off">
                        <datalist id="compare-unit-options"></datalist>
                        <span class="field-hint" id="compare-unit-hint">总量会按“SKU × 购买数量”计算；SKU 为空时，总量等于购买数量。单位可以从候选项选择，也可以手动输入。</span>
                    </label>
                    <div class="compare-total-line" aria-live="polite">合计 <output id="compare-total-quantity">1</output> <span id="compare-total-unit">kg</span></div>
                </form>
                <div class="actions"><button class="btn btn-primary" data-submit="compare" type="button">查看价格建议</button></div>
                <div class="helper">选择规则库中的商品名称后，会优先使用对应标准单位；SKU 为空时，总量等于购买数量。</div>
            </div>
        </div>
        <div class="panel result-area">
            <section id="module-help-panel" class="module-help-panel" aria-label="当前功能说明">
                <h2 id="module-description">比较当前价格与历史购买价格</h2>
                <div class="usage-tips" aria-label="使用提示">
                    <div class="tip-line"><span class="tip-index">1</span><span id="module-tip-1">选择已有商品，或输入订单中的商品名称。</span></div>
                    <div class="tip-line"><span class="tip-index">2</span><span id="module-tip-2">填写总价、单件规格、购买数量和单位，系统自动计算单价。</span></div>
                    <div class="tip-line"><span class="tip-index">3</span><span id="module-tip-3">遇到赠品、组合装或规格变化时，建议结合购买记录核对。</span></div>
                </div>
            </section>
            <div id="compare-result" class="empty-state"><div><strong>还没有查询结果</strong><span>填写商品信息后，这里会显示历史价格和购买建议。</span></div></div>
        </div>
    </div>
</section>
